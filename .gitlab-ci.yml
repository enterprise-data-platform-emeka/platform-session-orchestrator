# .gitlab-ci.yml — EDP Session Orchestrator
#
# Mirrors session-start.yml and session-destroy.yml from .github/workflows/.
#
# Trigger via: CI/CD → Pipelines → Run pipeline
# Set these variables in the "Variables" section before clicking Run:
#
#   SESSION START:
#     PIPELINE_TYPE           = start
#     ENV                     = dev | staging | prod
#     DB_PASSWORD             = <RDS master password>
#     REDSHIFT_ADMIN_PASSWORD = <Redshift admin password>
#
#   SESSION DESTROY:
#     PIPELINE_TYPE           = destroy
#     ENV                     = dev | staging | prod
#     DB_PASSWORD             = <RDS master password (required for TF variable validation)>
#     REDSHIFT_ADMIN_PASSWORD = <Redshift admin password (required for TF variable validation)>
#     CONFIRM                 = destroy
#
# Required CI/CD variables (set at group level so all repos inherit them):
#   AWS_ACCESS_KEY_ID       — IAM access key for the target AWS account
#   AWS_SECRET_ACCESS_KEY   — IAM secret key for the target AWS account
#   GITLAB_PAT              — GitLab Personal Access Token with read_repository scope,
#                             used to clone other repos in the enterprise-data-platform-emeka group.
#                             Alternative: enable CI_JOB_TOKEN access in each target repo's
#                             Settings → CI/CD → Token Access, then replace ${GITLAB_PAT}
#                             with ${CI_JOB_TOKEN} throughout this file.
#
# Note on AWS authentication: GitHub Actions uses OIDC (no long-lived keys). GitLab OIDC
# with AWS requires adding gitlab.com as an AWS IAM identity provider and updating the
# IAM role trust policy — a separate terraform-bootstrap change. Until that is done,
# use static IAM credentials stored in GitLab CI/CD variables above.

# Only run when triggered manually via the GitLab UI (Run pipeline button).
# Pushes and merge requests do not trigger this pipeline — it is infrastructure
# orchestration, not application CI.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  AWS_DEFAULT_REGION: eu-central-1
  TF_IN_AUTOMATION: "true"

stages:
  - infrastructure   # terraform apply / destroy
  - prepare          # sync-dbt and upload-dag (parallel)
  - pipeline         # trigger edp_pipeline DAG and poll to completion
  - deploy           # build and deploy analytics agent
  - summary          # print session access URLs

# ── Shared base configs ────────────────────────────────────────────────────────

# Jobs that run Terraform extend this to get a consistent install.
.terraform-base:
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl unzip git jq awscli
    - |
      curl -sSL \
        "https://releases.hashicorp.com/terraform/1.9.0/terraform_1.9.0_linux_amd64.zip" \
        -o /tmp/tf.zip
      unzip -q /tmp/tf.zip -d /usr/local/bin/
      rm /tmp/tf.zip
      terraform version

# Jobs that only need AWS CLI extend this.
.aws-base:
  image: python:3.11-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl jq
    - pip install --quiet awscli

# ─────────────────────────────────────────────────────────────────────────────
# SESSION START
# ─────────────────────────────────────────────────────────────────────────────

# ── Job 1: Apply all AWS infrastructure ───────────────────────────────────────

terraform-apply:
  extends: .terraform-base
  stage: infrastructure
  timeout: 40 minutes
  rules:
    - if: '$PIPELINE_TYPE == "start"'
  script:
    - git clone
        "https://gitlab-ci-token:${GITLAB_PAT}@gitlab.com/enterprise-data-platform-emeka/terraform-platform-infra-live.git"
    - cd terraform-platform-infra-live/environments/${ENV}
    - export TF_VAR_db_password="${DB_PASSWORD}"
    - export TF_VAR_redshift_admin_password="${REDSHIFT_ADMIN_PASSWORD}"
    - terraform init
    - terraform apply -auto-approve
    # Capture outputs for downstream jobs via dotenv artifact.
    - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - ALB_DNS=$(terraform output -raw analytics_agent_alb_dns)
    - echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "${CI_PROJECT_DIR}/tf-outputs.env"
    - echo "ALB_DNS=${ALB_DNS}"       >> "${CI_PROJECT_DIR}/tf-outputs.env"
    - echo "Infrastructure applied. ALB DNS = ${ALB_DNS}"
  artifacts:
    reports:
      # ACCOUNT_ID and ALB_DNS are exported as environment variables in all
      # downstream jobs that list terraform-apply in their needs.
      dotenv: tf-outputs.env

# ── Job 2: Sync dbt project to S3 (parallel with upload-dag) ─────────────────

sync-dbt:
  extends: .aws-base
  stage: prepare
  rules:
    - if: '$PIPELINE_TYPE == "start"'
  needs:
    - job: terraform-apply
      artifacts: true   # imports ACCOUNT_ID and ALB_DNS
  script:
    - git clone
        "https://gitlab-ci-token:${GITLAB_PAT}@gitlab.com/enterprise-data-platform-emeka/platform-dbt-analytics.git"
    - cd platform-dbt-analytics
    - MWAA_BUCKET="edp-${ENV}-${ACCOUNT_ID}-mwaa-dags"
    - |
      aws s3 sync . "s3://${MWAA_BUCKET}/dbt/platform-dbt-analytics/" \
        --delete \
        --exclude ".git/*" \
        --exclude ".gitlab-ci.yml" \
        --exclude "__pycache__/*" \
        --exclude ".venv/*" \
        --exclude "target/*" \
        --exclude "dbt_packages/*" \
        --exclude "logs/*"
    - echo "dbt project synced to s3://${MWAA_BUCKET}/dbt/platform-dbt-analytics/"

# ── Job 3: Upload DAG to MWAA S3 bucket (parallel with sync-dbt) ─────────────

upload-dag:
  extends: .aws-base
  stage: prepare
  rules:
    - if: '$PIPELINE_TYPE == "start"'
  needs:
    - job: terraform-apply
      artifacts: true
  script:
    - MWAA_ENV_NAME="edp-${ENV}-mwaa"
    - |
      STATUS=$(aws mwaa get-environment \
        --name "${MWAA_ENV_NAME}" \
        --query "Environment.Status" \
        --output text)
      echo "MWAA status: ${STATUS}"
      if [ "${STATUS}" != "AVAILABLE" ]; then
        echo "MWAA is ${STATUS}. Expected AVAILABLE after terraform apply."
        exit 1
      fi
    - git clone
        "https://gitlab-ci-token:${GITLAB_PAT}@gitlab.com/enterprise-data-platform-emeka/platform-orchestration-mwaa-airflow.git"
    - MWAA_BUCKET="edp-${ENV}-${ACCOUNT_ID}-mwaa-dags"
    - |
      aws s3 sync platform-orchestration-mwaa-airflow/dags/ "s3://${MWAA_BUCKET}/dags/" \
        --delete \
        --exclude "__pycache__/*" \
        --exclude "*.pyc"
    - echo "DAGs uploaded to s3://${MWAA_BUCKET}/dags/"
    - echo "MWAA picks up new DAG files within ~30 seconds."

# ── Job 4: Trigger edp_pipeline DAG and poll until completion ─────────────────

trigger-and-poll-pipeline:
  extends: .aws-base
  stage: pipeline
  timeout: 35 minutes
  rules:
    - if: '$PIPELINE_TYPE == "start"'
  needs:
    - sync-dbt
    - upload-dag
    - job: terraform-apply
      artifacts: true
  script:
    - MWAA_ENV_NAME="edp-${ENV}-mwaa"

    # Wait up to 3 minutes for the scheduler to parse and register the DAG.
    # Triggering before registration silently creates no run.
    - |
      MAX_WAIT=18
      FOUND=0
      for i in $(seq 1 "${MAX_WAIT}"); do
        RESPONSE=$(aws mwaa create-cli-token --name "${MWAA_ENV_NAME}" --output json)
        CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
        WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')
        RAW=$(curl -s \
          -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
          -H "Authorization: Bearer ${CLI_TOKEN}" \
          -H "Content-Type: text/plain" \
          --data "dags list -o json" \
          | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || echo "")
        if echo "${RAW}" | python3 -c "
      import sys, json
      try:
          dags = json.loads(sys.stdin.read())
          ids = [d.get('dag_id', '') for d in dags]
          print('found' if 'edp_pipeline' in ids else 'not_found')
      except Exception:
          print('not_found')
      " | grep -q found; then
          echo "edp_pipeline registered (attempt ${i}/${MAX_WAIT})."
          FOUND=1
          break
        fi
        echo "Attempt ${i}/${MAX_WAIT}: DAG not yet registered. Waiting 10s..."
        sleep 10
      done
      if [ "${FOUND}" -eq 0 ]; then
        echo "edp_pipeline did not appear in Airflow within 3 minutes."
        exit 1
      fi

    # Unpause — new MWAA environments default to all DAGs paused.
    - |
      RESPONSE=$(aws mwaa create-cli-token --name "${MWAA_ENV_NAME}" --output json)
      CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
      WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')
      curl -s -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
        -H "Authorization: Bearer ${CLI_TOKEN}" \
        -H "Content-Type: text/plain" \
        --data "dags unpause edp_pipeline" \
        | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || true

    # Trigger the DAG.
    - |
      RESPONSE=$(aws mwaa create-cli-token --name "${MWAA_ENV_NAME}" --output json)
      CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
      WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')
      HTTP_STATUS=$(curl -s \
        -o /tmp/trigger_out.json \
        -w "%{http_code}" \
        -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
        -H "Authorization: Bearer ${CLI_TOKEN}" \
        -H "Content-Type: text/plain" \
        --data "dags trigger edp_pipeline")
      echo "HTTP status: ${HTTP_STATUS}"
      if [ -s /tmp/trigger_out.json ]; then
        STDOUT=$(jq -r '.stdout // ""' /tmp/trigger_out.json | base64 --decode 2>/dev/null || true)
        STDERR=$(jq -r '.stderr // ""' /tmp/trigger_out.json | base64 --decode 2>/dev/null || true)
        [ -n "${STDOUT}" ] && echo "stdout: ${STDOUT}"
        [ -n "${STDERR}" ] && echo "stderr: ${STDERR}"
      fi
      if [ "${HTTP_STATUS}" != "200" ]; then
        echo "DAG trigger failed (HTTP ${HTTP_STATUS})."
        exit 1
      fi
      echo "edp_pipeline triggered. Waiting 15s for the run to register..."
      sleep 15

    # Poll every 30 s for up to 30 minutes.
    - |
      MAX_ATTEMPTS=60
      SLEEP_SECONDS=30
      ATTEMPT=0
      while [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; do
        ATTEMPT=$((ATTEMPT + 1))
        echo "Poll ${ATTEMPT}/${MAX_ATTEMPTS} — $(date -u '+%H:%M:%S UTC')"
        RESPONSE=$(aws mwaa create-cli-token --name "${MWAA_ENV_NAME}" --output json)
        CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
        WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')
        HTTP_STATUS=$(curl -s \
          -o /tmp/poll_out.json \
          -w "%{http_code}" \
          -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
          -H "Authorization: Bearer ${CLI_TOKEN}" \
          -H "Content-Type: text/plain" \
          --data "dags list-runs --dag-id edp_pipeline --no-backfill -o json")
        if [ "${HTTP_STATUS}" != "200" ]; then
          echo "  Poll request failed (HTTP ${HTTP_STATUS}), retrying..."
          sleep "${SLEEP_SECONDS}"
          continue
        fi
        RAW=$(jq -r '.stdout // ""' /tmp/poll_out.json | base64 --decode 2>/dev/null || echo "")
        STATE=$(echo "${RAW}" | python3 -c "
      import sys, json
      try:
          runs = json.loads(sys.stdin.read())
          print(runs[0].get('state', 'unknown') if runs else 'no_runs')
      except Exception:
          print('parse_error')
      " 2>/dev/null || echo "unknown")
        echo "  Most recent run state: ${STATE}"
        case "${STATE}" in
          success)
            echo ""
            echo "edp_pipeline completed successfully."
            exit 0
            ;;
          failed)
            echo ""
            echo "edp_pipeline FAILED. Check the MWAA Airflow UI for task logs."
            exit 1
            ;;
          *)
            echo "  Still in progress. Waiting ${SLEEP_SECONDS}s..."
            sleep "${SLEEP_SECONDS}"
            ;;
        esac
      done
      echo ""
      echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
      echo "Check the MWAA Airflow UI to see where the pipeline stalled."
      exit 1

# ── Job 5: Build and deploy analytics agent ────────────────────────────────────
# Runs after the pipeline completes — the agent loads Gold schemas at startup,
# so the dbt Gold tables must exist before the agent container starts.

deploy-agent:
  stage: deploy
  image: docker:24
  services:
    - docker:24-dind
  timeout: 20 minutes
  rules:
    - if: '$PIPELINE_TYPE == "start"'
  needs:
    - trigger-and-poll-pipeline
    - job: terraform-apply
      artifacts: true   # imports ACCOUNT_ID
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache python3 py3-pip curl jq git awscli
  script:
    - git clone
        "https://gitlab-ci-token:${GITLAB_PAT}@gitlab.com/enterprise-data-platform-emeka/platform-analytics-agent.git"
    - cd platform-analytics-agent
    - ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - ECR_REPOSITORY="edp-${ENV}-analytics-agent"
    - IMAGE_TAG="sha-${CI_COMMIT_SHA}"
    - IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

    # Log in to ECR.
    - aws ecr get-login-password --region "${AWS_DEFAULT_REGION}"
        | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

    # Build and push both the SHA-tagged and :latest images.
    - docker build --target runtime
        -t "${IMAGE_URI}"
        -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
        .
    - docker push "${IMAGE_URI}"
    - docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"

    # Register a new task definition revision with the SHA-tagged image,
    # then roll it out to the ECS service and wait for stability.
    - aws ecs describe-task-definition
        --task-definition "edp-${ENV}-analytics-agent"
        --query taskDefinition
        > /tmp/task_def.json
    - |
      IMAGE_URI="${IMAGE_URI}" python3 << 'PYEOF'
      import json, os

      with open('/tmp/task_def.json') as f:
          task = json.load(f)

      # Strip fields that are invalid in a register-task-definition call.
      for key in ['taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                  'placementConstraints', 'compatibilities', 'registeredAt', 'registeredBy']:
          task.pop(key, None)

      task['containerDefinitions'][0]['image'] = os.environ['IMAGE_URI']

      with open('/tmp/new_task_def.json', 'w') as f:
          json.dump(task, f)
      PYEOF
    - NEW_TASK_ARN=$(aws ecs register-task-definition
        --cli-input-json file:///tmp/new_task_def.json
        --query 'taskDefinition.taskDefinitionArn'
        --output text)
    - echo "New task definition: ${NEW_TASK_ARN}"
    - aws ecs update-service
        --cluster "edp-${ENV}-analytics-agent"
        --service "edp-${ENV}-analytics-agent"
        --task-definition "${NEW_TASK_ARN}"
        --force-new-deployment
    - aws ecs wait services-stable
        --cluster "edp-${ENV}-analytics-agent"
        --services "edp-${ENV}-analytics-agent"
    - echo "Analytics agent deployed and stable."

# ── Job 6: Print session access URLs ─────────────────────────────────────────

session-ready:
  stage: summary
  image: alpine:3
  rules:
    - if: '$PIPELINE_TYPE == "start"'
  needs:
    - deploy-agent
    - job: terraform-apply
      artifacts: true   # imports ALB_DNS
  script:
    - |
      echo ""
      echo "================================================"
      echo "  SESSION IS READY"
      echo "================================================"
      echo ""
      echo "  Environment  : ${ENV}"
      echo ""
      echo "  Streamlit UI (open in browser):"
      echo "    http://${ALB_DNS}:8501"
      echo ""
      echo "  FastAPI (curl from within VPC):"
      echo "    curl -s -X POST http://${ALB_DNS}/ask \\"
      echo "      -H 'Content-Type: application/json' \\"
      echo "      -d '{\"question\": \"Which country has the highest revenue?\"}'"
      echo ""
      echo "  When done: re-run pipeline with PIPELINE_TYPE=destroy"
      echo "  Cost so far: ~\$0.30-\$0.50 (infra up, no queries yet)"
      echo ""
      echo "================================================"

# ─────────────────────────────────────────────────────────────────────────────
# SESSION DESTROY
# ─────────────────────────────────────────────────────────────────────────────

terraform-destroy:
  extends: .terraform-base
  stage: infrastructure
  timeout: 20 minutes
  rules:
    - if: '$PIPELINE_TYPE == "destroy" && $CONFIRM == "destroy"'
  script:
    - git clone
        "https://gitlab-ci-token:${GITLAB_PAT}@gitlab.com/enterprise-data-platform-emeka/terraform-platform-infra-live.git"
    - cd terraform-platform-infra-live/environments/${ENV}
    - export TF_VAR_db_password="${DB_PASSWORD}"
    - export TF_VAR_redshift_admin_password="${REDSHIFT_ADMIN_PASSWORD}"
    - terraform init
    - terraform destroy -auto-approve
    - |
      echo ""
      echo "================================================"
      echo "  SESSION DESTROYED"
      echo "================================================"
      echo ""
      echo "  All ${ENV} AWS resources have been torn down."
      echo "  Typical session cost: ~\$1.50-\$2.50 for a 2-3 hour session."
      echo ""
      echo "  terraform-bootstrap resources (OIDC provider, tfstate bucket,"
      echo "  DynamoDB lock table) are permanent and were NOT destroyed."
      echo ""
      echo "================================================"

# Safety net: if CONFIRM was not typed exactly, explain and fail loudly.
destroy-safety-check-failed:
  stage: infrastructure
  image: alpine:3
  rules:
    - if: '$PIPELINE_TYPE == "destroy" && $CONFIRM != "destroy"'
  script:
    - |
      echo "Destroy was NOT triggered."
      echo "You entered CONFIRM='${CONFIRM}'"
      echo "Expected:          'destroy'"
      echo ""
      echo "Re-run the pipeline and set CONFIRM=destroy exactly."
      exit 1
