name: Session Destroy

# Tears down all AWS infrastructure for the chosen environment.
#
# Safety guard: you must type "destroy" exactly in the confirm input.
# The job is skipped entirely if the confirmation does not match.
#
# What this destroys:
#   Everything created by terraform-platform-infra-live for the chosen
#   environment: VPC (Virtual Private Cloud), MWAA (Amazon Managed Workflows
#   for Apache Airflow), ECS (Elastic Container Service) Fargate tasks,
#   ALB (Application Load Balancer), Athena, and session IAM roles.
#   Session S3 contents are permanently emptied, including object versions.
#   Data-lake bucket containers and standalone Glue job definitions remain.
#
# What this does NOT destroy:
#   terraform-bootstrap resources (OIDC provider, github-actions-role, tfstate
#   bucket, DynamoDB lock table). These survive every session by design.
#
# Prerequisites:
#   Same as Session Start — OIDC role and GitHub Environments must exist.
#   GH_PAT secret required to check out terraform-platform-infra-live.
#
# Required secrets (Settings -> Environments -> {env} -> Secrets):
#   DB_PASSWORD             — RDS master password
#   REDSHIFT_ADMIN_PASSWORD — Redshift admin password
#

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to destroy"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: "Type 'destroy' to tear down runtime AND permanently empty session data"
        required: true
        type: string

concurrency:
  group: platform-session-${{ inputs.env }}
  cancel-in-progress: false

jobs:
  terraform-destroy:
    name: Destroy ${{ inputs.env }} infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    # Hard stop if the user did not type "destroy" exactly.
    if: ${{ inputs.confirm == 'destroy' }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:                           ${{ inputs.env }}
      AWS_REGION:                    eu-central-1
      TF_VAR_db_password:            ${{ secrets.DB_PASSWORD }}
      TF_VAR_redshift_admin_password: ${{ secrets.REDSHIFT_ADMIN_PASSWORD }}

    steps:
      - name: Checkout terraform-platform-infra-live
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/terraform-platform-infra-live
          token: ${{ secrets.GH_PAT }}

      - name: Checkout session cleanup helpers
        uses: actions/checkout@v4
        with:
          path: session-tools

      - name: Install cleanup dependencies
        run: python3 -m pip install --quiet boto3==1.35.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Mask AWS account ID in logs
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: echo "::add-mask::${ACCOUNT_ID}"

      - name: Configure AWS credentials (OIDC)
        env:
          ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: Terraform init
        run: |
          cd environments/${{ env.ENV }}
          terraform init

      - name: Disable RDS deletion protection (pre-destroy safety)
        run: |
          DB_ID="edp-${{ env.ENV }}-source-db"
          PROTECTION=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --query 'DBInstances[0].DeletionProtection' \
            --output text 2>/dev/null || echo "FALSE")
          if [ "$PROTECTION" = "True" ]; then
            echo "Deletion protection is ON for $DB_ID — disabling before destroy..."
            aws rds modify-db-instance \
              --db-instance-identifier "$DB_ID" \
              --no-deletion-protection \
              --apply-immediately
            echo "Waiting 15 s for modification to apply..."
            sleep 15
          else
            echo "Deletion protection already off or instance does not exist — no action needed."
          fi

      - name: Stop standalone Glue writers
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: python3 session-tools/scripts/session_data.py stop-glue --environment "$ENV"

      - name: Terraform destroy (keeps emptyable data buckets)
        id: terraform_destroy
        continue-on-error: true
        run: make destroy-safe ${{ env.ENV }}

      - name: Empty all session S3 data and verify
        if: ${{ steps.terraform_destroy.outcome == 'success' }}
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: python3 session-tools/scripts/session_data.py empty --environment "$ENV"

      - name: Schedule leftover customer-managed KMS keys
        if: ${{ steps.terraform_destroy.outcome == 'success' }}
        run: |
          set -euo pipefail

          echo "Checking for leftover customer-managed KMS keys tagged for ${ENV}..."
          KEY_ARNS=$(aws resourcegroupstaggingapi get-resources \
            --region "${AWS_REGION}" \
            --tag-filters Key=Environment,Values="${ENV}" Key=Project,Values=EnterpriseDataPlatform \
            --resource-type-filters kms:key \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text)

          if [ -z "${KEY_ARNS}" ] || [ "${KEY_ARNS}" = "None" ]; then
            echo "No tagged KMS keys found."
            exit 0
          fi

          for KEY_ARN in ${KEY_ARNS}; do
            KEY_MANAGER=$(aws kms describe-key \
              --region "${AWS_REGION}" \
              --key-id "${KEY_ARN}" \
              --query 'KeyMetadata.KeyManager' \
              --output text)
            KEY_STATE=$(aws kms describe-key \
              --region "${AWS_REGION}" \
              --key-id "${KEY_ARN}" \
              --query 'KeyMetadata.KeyState' \
              --output text)

            if [ "${KEY_MANAGER}" != "CUSTOMER" ]; then
              echo "Skipping AWS-managed key."
              continue
            fi

            if [ "${KEY_STATE}" = "PendingDeletion" ] || [ "${KEY_STATE}" = "PendingReplicaDeletion" ]; then
              echo "KMS key already pending deletion."
              continue
            fi

            echo "Scheduling session KMS key deletion."
            aws kms schedule-key-deletion \
              --region "${AWS_REGION}" \
              --key-id "${KEY_ARN}" \
              --pending-window-in-days 7 >/dev/null
          done

          cd environments/${ENV}
          STATE_RESOURCES=$(terraform state list)
          if printf '%s\n' "$STATE_RESOURCES" | grep -qx 'module.iam_metadata.aws_kms_key.platform'; then
            terraform state rm module.iam_metadata.aws_kms_key.platform >/dev/null
          fi

      - name: Verify no billable session resources remain
        run: |
          set -euo pipefail

          failures=0

          RDS_INSTANCES=$(aws rds describe-db-instances \
            --region "${AWS_REGION}" \
            --query "DBInstances[?starts_with(DBInstanceIdentifier, \`edp-${ENV}-\`)].DBInstanceIdentifier" \
            --output text)
          if [ -n "${RDS_INSTANCES}" ] && [ "${RDS_INSTANCES}" != "None" ]; then
            echo "ERROR: RDS instances still exist: ${RDS_INSTANCES}"
            failures=1
          fi

          NAT_GATEWAYS=$(aws ec2 describe-nat-gateways \
            --region "${AWS_REGION}" \
            --filter Name=state,Values=pending,available,deleting Name=tag:Environment,Values="${ENV}" \
            --query 'NatGateways[].NatGatewayId' \
            --output text)
          if [ -n "${NAT_GATEWAYS}" ] && [ "${NAT_GATEWAYS}" != "None" ]; then
            echo "ERROR: NAT gateways still exist: ${NAT_GATEWAYS}"
            failures=1
          fi

          ELASTIC_IPS=$(aws ec2 describe-addresses \
            --region "${AWS_REGION}" \
            --filters Name=tag:Environment,Values="${ENV}" \
            --query 'Addresses[?AssociationId==null].AllocationId' \
            --output text)
          if [ -n "${ELASTIC_IPS}" ] && [ "${ELASTIC_IPS}" != "None" ]; then
            echo "ERROR: Unassociated Elastic IPs still exist: ${ELASTIC_IPS}"
            failures=1
          fi

          ACTIVE_KMS_KEYS=$(aws resourcegroupstaggingapi get-resources \
            --region "${AWS_REGION}" \
            --tag-filters Key=Environment,Values="${ENV}" Key=Project,Values=EnterpriseDataPlatform \
            --resource-type-filters kms:key \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text)
          for KEY_ARN in ${ACTIVE_KMS_KEYS}; do
            KEY_STATE=$(aws kms describe-key \
              --region "${AWS_REGION}" \
              --key-id "${KEY_ARN}" \
              --query 'KeyMetadata.KeyState' \
              --output text)
            if [ "${KEY_STATE}" != "PendingDeletion" ] && [ "${KEY_STATE}" != "PendingReplicaDeletion" ]; then
              echo "ERROR: customer-managed KMS key is not pending deletion: ${KEY_ARN} (${KEY_STATE})"
              failures=1
            fi
          done

          if [ "${failures}" -ne 0 ]; then
            echo "Post-destroy billable resource check failed."
            exit 1
          fi

          echo "Post-destroy billable resource check passed."

      - name: Fail if Terraform destroy failed
        if: ${{ steps.terraform_destroy.outcome != 'success' }}
        run: |
          echo "Terraform destroy failed before cleanup completed. Cleanup guards ran, but inspect the Terraform logs."
          exit 1

      - name: Destroy summary
        if: ${{ steps.terraform_destroy.outcome == 'success' }}
        run: |
          echo ""
          echo "================================================"
          echo "  SESSION DESTROYED"
          echo "================================================"
          echo ""
          echo "  Session runtime removed; session S3 objects and versions emptied."
          echo ""
          echo "  terraform-bootstrap resources (OIDC, tfstate bucket, lock"
          echo "  table) are permanent and were NOT destroyed."
          echo ""
          echo "================================================"

  safety-check-failed:
    name: Confirmation mismatch — destroy skipped
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm != 'destroy' }}
    steps:
      - name: Explain skip
        run: |
          echo "Destroy was NOT triggered."
          echo "You entered: '${{ inputs.confirm }}'"
          echo "Expected:    'destroy'"
          echo ""
          echo "Re-run the workflow and type 'destroy' exactly in the confirm field."
