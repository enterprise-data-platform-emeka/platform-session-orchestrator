name: Docs Required Checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "html/**"
      - "images/**"

jobs:
  security-scan:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - name: Mark documentation-only security scan as passed
        run: |
          echo "Documentation-only change. No orchestrator security scan is required."
