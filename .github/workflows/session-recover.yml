name: Session Recover
on:
  workflow_dispatch:
    inputs:
      env:
        description: Existing Step Functions session environment
        required: true
        type: choice
        default: dev
        options: [dev, staging, prod]
      scope:
        description: Recovery scope (payment repair updates source and three Bronze tables)
        required: true
        type: choice
        default: gold
        options: [gold, silver-and-gold, repair-seed-payments]
      silver_table:
        description: Used only with silver-and-gold
        required: true
        type: choice
        default: fact_payments
        options: [dim_customer, dim_product, fact_orders, fact_order_items, fact_payments, fact_shipments]
      deploy_applications:
        description: Deploy analytics agent after validated recovery
        required: true
        type: boolean
        default: true
      deploy_analytics_web:
        description: Also deploy the existing analytics web service (must already be provisioned)
        type: boolean
        default: false
      deploy_slack_mcp:
        description: Also deploy the existing Slack service (must already be provisioned)
        type: boolean
        default: false
concurrency:
  group: platform-session-${{ inputs.env }}
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  repair:
    name: Repair canonical seed payments
    if: ${{ inputs.scope == 'repair-seed-payments' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.env }}
    env:
      ENV: ${{ inputs.env }}
      AWS_REGION: eu-central-1
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
    steps:
      - name: Checkout recovery helpers
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery dependencies
        run: python -m pip install boto3==1.35.0 pyarrow==17.0.0
      - name: Mask AWS account ID in logs
        run: echo "::add-mask::${ACCOUNT_ID}"
      - name: Configure AWS credentials (OIDC)
        env:
          ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: Verify existing session is idle
        run: python scripts/session_recover.py preflight
      - name: Checkout simulator repair
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-cdc-simulator
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: simulator
      - name: Build immutable repair image
        run: |
          set -euo pipefail
          SIMULATOR_SHA=$(git -C simulator rev-parse HEAD)
          ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/edp-${ENV}-cdc-simulator:sha-${SIMULATOR_SHA}"
          echo "::add-mask::${ECR_REGISTRY}"
          echo "::add-mask::${IMAGE_URI}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY" >/dev/null 2>&1
          if ! docker build -t "$IMAGE_URI" simulator > /tmp/repair-build.log 2>&1; then
            echo "Repair image build failed."; exit 1
          fi
          if ! docker push "$IMAGE_URI" > /tmp/repair-push.log 2>&1; then
            echo "Repair image push failed."; exit 1
          fi
          DIGEST=$(aws ecr describe-images --repository-name "edp-${ENV}-cdc-simulator" --image-ids "imageTag=sha-${SIMULATOR_SHA}" --query 'imageDetails[0].imageDigest' --output text)
          echo "REPAIR_IMAGE=${ECR_REGISTRY}/edp-${ENV}-cdc-simulator@${DIGEST}" >> "$GITHUB_ENV"
          echo "SIMULATOR_SHA=${SIMULATOR_SHA}" >> "$GITHUB_ENV"
          echo "Repair image prepared from simulator commit ${SIMULATOR_SHA}."
      - name: Repair source and refresh affected Bronze tables
        run: python scripts/session_recover.py repair

  process:
    name: Recover processing and validate dbt
    needs: repair
    if: ${{ always() && !cancelled() && (needs.repair.result == 'success' || needs.repair.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: ${{ inputs.env }}
    env:
      ENV: ${{ inputs.env }}
      AWS_REGION: eu-central-1
      ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      RECOVERY_SCOPE: ${{ inputs.scope }}
      SILVER_TABLE: ${{ inputs.silver_table }}
    steps:
      - name: Checkout recovery helpers
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install recovery dependencies
        run: python -m pip install boto3==1.35.0 pyarrow==17.0.0
      - name: Mask AWS account ID in logs
        run: echo "::add-mask::${ACCOUNT_ID}"
      - name: Configure AWS credentials (OIDC)
        env:
          ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: Checkout Glue jobs
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-glue-jobs
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: glue
      - name: Checkout dbt project
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-dbt-analytics
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: dbt
      - name: Record processing revisions
        run: |
          echo "GLUE_SHA=$(git -C glue rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "DBT_SHA=$(git -C dbt rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Using merged Glue and dbt code from main."
      - name: Run selected recovery scope
        run: python scripts/session_recover.py process

  deploy-applications:
    needs: process
    if: ${{ always() && !cancelled() && inputs.deploy_applications && needs.process.result == 'success' }}
    uses: ./.github/workflows/deploy-session-apps.yml
    with:
      env: ${{ inputs.env }}
      deploy_slack_mcp: ${{ inputs.deploy_slack_mcp }}
      deploy_analytics_web: ${{ inputs.deploy_analytics_web }}
    secrets: inherit

  recovery-ready:
    needs: [process, deploy-applications]
    if: ${{ always() && needs.process.result == 'success' && (needs.deploy-applications.result == 'success' || (!inputs.deploy_applications && needs.deploy-applications.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Recovery summary
        run: |
          echo "Selected recovery scope completed and dbt validation passed."
          echo "Existing infrastructure was reused. Session Destroy remains the end-of-day cleanup."
