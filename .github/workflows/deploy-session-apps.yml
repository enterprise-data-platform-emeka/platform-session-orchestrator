name: Deploy session applications
on:
  workflow_call:
    inputs:
      env:
        required: true
        type: string
      deploy_slack_mcp:
        type: boolean
        default: false
      deploy_analytics_web:
        type: boolean
        default: false
jobs:
  deploy-agent:
    name: Build and deploy analytics agent (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:            ${{ inputs.env }}
      AWS_REGION:     eu-central-1
      CONTAINER_NAME: agent

    steps:
      - name: Checkout platform-analytics-agent
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-analytics-agent
          token: ${{ secrets.GH_PAT }}

      - name: Mask AWS account ID in logs
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: echo "::add-mask::${ACCOUNT_ID}"

      - name: Configure AWS credentials (OIDC)
        env:
          ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: Log in to Amazon ECR
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${ECR_REGISTRY}" >/dev/null
          echo "Logged in to Amazon ECR."

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REPOSITORY: edp-${{ env.ENV }}-analytics-agent
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::${ECR_REGISTRY}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          if ! docker build --target runtime \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            . >/tmp/docker-build.log 2>&1; then
            echo "Docker build failed."
            exit 1
          fi
          docker push "${IMAGE_URI}" >/dev/null
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >/dev/null
          echo "Container image pushed to ECR."
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-analytics-agent
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-analytics-agent
          cluster:                    edp-${{ env.ENV }}-analytics-agent
          wait-for-service-stability: true

# ── Job 8: Optionally build and deploy Slack MCP gateway ─────────────────────

  deploy-slack-mcp:
    name: Build and deploy Slack MCP gateway (${{ inputs.env }})
    needs: deploy-agent
    if: ${{ always() && needs.deploy-agent.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:            ${{ inputs.env }}
      AWS_REGION:     eu-central-1
      CONTAINER_NAME: gateway

    steps:
      - name: Skip when Slack MCP is disabled
        if: ${{ !inputs.deploy_slack_mcp }}
        run: echo "deploy_slack_mcp is false. Skipping Slack MCP gateway deploy."

      - name: Checkout platform-slack-mcp-gateway
        if: ${{ inputs.deploy_slack_mcp }}
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-slack-mcp-gateway
          token: ${{ secrets.GH_PAT }}

      - name: Mask AWS account ID in logs
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: echo "::add-mask::${ACCOUNT_ID}"

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          ROLE_ARN: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          AWS_REGION_VALUE: ${{ env.AWS_REGION }}
        run: |
          echo "::add-mask::${ROLE_ARN}"
          OIDC_TOKEN_JSON=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(printf '%s' "${OIDC_TOKEN_JSON}" | jq -r '.value')
          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn "${ROLE_ARN}" \
            --role-session-name "github-actions" \
            --web-identity-token "${OIDC_TOKEN}" \
            --duration-seconds 3600 \
            --query Credentials \
            --output json)
          AWS_ACCESS_KEY_ID=$(printf '%s' "${CREDS}" | jq -r '.AccessKeyId')
          AWS_SECRET_ACCESS_KEY=$(printf '%s' "${CREDS}" | jq -r '.SecretAccessKey')
          AWS_SESSION_TOKEN=$(printf '%s' "${CREDS}" | jq -r '.SessionToken')
          echo "::add-mask::${AWS_ACCESS_KEY_ID}"
          echo "::add-mask::${AWS_SECRET_ACCESS_KEY}"
          echo "::add-mask::${AWS_SESSION_TOKEN}"
          {
            echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}"
            echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}"
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}"
            echo "AWS_REGION=${AWS_REGION_VALUE}"
            echo "AWS_DEFAULT_REGION=${AWS_REGION_VALUE}"
          } >> "$GITHUB_ENV"
          echo "AWS credentials configured via OIDC."
      - name: Seed Slack tokens into Secrets Manager
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "/edp/${ENV}/slack_mcp/slack_app_token" \
            --secret-string "${SLACK_APP_TOKEN}" \
            >/dev/null
          aws secretsmanager put-secret-value \
            --secret-id "/edp/${ENV}/slack_mcp/slack_bot_token" \
            --secret-string "${SLACK_BOT_TOKEN}" \
            >/dev/null
          echo "Slack tokens seeded into Secrets Manager."

      - name: Log in to Amazon ECR
        if: ${{ inputs.deploy_slack_mcp }}
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::${ECR_REGISTRY}"
          aws ecr get-login-password --region "${AWS_REGION}" |
            docker login --username AWS --password-stdin "${ECR_REGISTRY}" >/dev/null
          echo "Logged in to Amazon ECR."

      - name: Build, tag, and push image to ECR
        if: ${{ inputs.deploy_slack_mcp }}
        id: build-image
        env:
          ECR_REPOSITORY: edp-${{ env.ENV }}-slack-mcp-gateway
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "::add-mask::${ECR_REGISTRY}"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          if ! docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            . >/tmp/docker-build.log 2>&1; then
            echo "Docker build failed."
            exit 1
          fi
          docker push "${IMAGE_URI}" >/dev/null
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" >/dev/null
          echo "Container image pushed to ECR."
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-slack-mcp-gateway
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        if: ${{ inputs.deploy_slack_mcp }}
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        if: ${{ inputs.deploy_slack_mcp }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-slack-mcp-gateway
          cluster:                    edp-${{ env.ENV }}-slack-mcp-gateway
          wait-for-service-stability: false

      - name: Scale Slack MCP gateway to one task
        if: ${{ inputs.deploy_slack_mcp }}
        run: |
          aws ecs update-service \
            --cluster "edp-${ENV}-slack-mcp-gateway" \
            --service "edp-${ENV}-slack-mcp-gateway" \
            --desired-count 1 \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable \
            --cluster "edp-${ENV}-slack-mcp-gateway" \
            --services "edp-${ENV}-slack-mcp-gateway"
          echo "Slack MCP gateway deployed and stable."

# ── Job 9: Optionally build and deploy custom analytics web dashboard ────────

  deploy-analytics-web:
    name: Build and deploy analytics web (${{ inputs.env }})
    needs: deploy-agent
