name: Session Start

# Orchestrates a full EDP (Enterprise Data Platform) session from scratch.
#
# Dependency order:
#
#   terraform-apply (~5 min for Step Functions, ~25 min for MWAA)
#       |
#       |--- cdc-source-ready (optional; seed RDS, start DMS, launch live injection)
#       |--- deploy-glue-scripts (seconds) ───────────────────\
#       |--- sync-dbt (seconds) ──────────────────────────────+──> trigger-pipeline (~10 min)
#       |--- upload-dag (MWAA only, seconds) ─────────────────/          |
#                                                                     deploy-agent (~5 min)
#                                                                           |
#                                                                     session-ready
#
# Orchestrator choices:
#   step-functions (default): Step Functions state machine. No separate DAG upload.
#     Fast: no 25-min MWAA startup wait. Run this for every dev session.
#   mwaa: Full MWAA Airflow environment with visual task dependency graph in the Airflow UI.
#     Use this when a visual task graph or full Airflow capabilities are needed.
#
# Serving choices:
#   athena-only (default): Gold data stays queryable in Athena/S3. No Redshift cost.
#   redshift-bi: Creates Redshift Serverless as the BI serving layer.
#
# Prerequisites (one-time setup):
#   1. terraform-bootstrap applied — creates OIDC provider and github-actions-role.
#   2. terraform-github-setup applied — creates GitHub Environments (dev/staging/prod)
#      and the AWS_ACCOUNT_ID repository variable in this repo.
#   3. GH_PAT repository secret — a GitHub Personal Access Token with repo scope,
#      used to check out other repos in the org during this workflow.
#
# Required secrets / variables (Settings -> Secrets and variables -> Actions):
#   Secrets (per Environment: dev / staging / prod):
#     GH_PAT          — GitHub PAT with repo scope (for cross-repo checkout)
#     DB_PASSWORD     — RDS source database password (required when run_cdc_simulator=true)
#     REDSHIFT_ADMIN_PASSWORD — Redshift admin password (required when serving is enabled)
#     SLACK_APP_TOKEN — Slack Socket Mode app token (xapp-...), used when deploy_slack_mcp=true
#     SLACK_BOT_TOKEN — Slack bot OAuth token (xoxb-...), used when deploy_slack_mcp=true
#   Variables (per Environment: dev / staging / prod):
#     AWS_ACCOUNT_ID  — 12-digit AWS account ID (not sensitive, used in resource names)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      orchestrator:
        description: "Orchestrator (step-functions for fast startup, mwaa for Airflow UI with visual task graph)"
        required: true
        default: step-functions
        type: choice
        options: [step-functions, mwaa]
      serving_layer:
        description: "BI/query serving layer"
        required: true
        default: athena-only
        type: choice
        options: [athena-only, redshift-bi]
      db_password:
        description: "RDS master password. Prefer environment secret DB_PASSWORD; this input is a manual fallback."
        required: false
        type: string
      redshift_admin_password:
        description: "Redshift admin password. Prefer environment secret REDSHIFT_ADMIN_PASSWORD; this input is a manual fallback."
        required: false
        type: string
      run_cdc_simulator:
        description: "Create dev CDC infrastructure, seed RDS, start DMS, and run live injection."
        required: true
        default: false
        type: boolean
      cdc_simulator_duration_minutes:
        description: "Live CDC injection duration after seed/bootstrap"
        required: true
        default: "10"
        type: choice
        options: ["5", "10", "15", "30", "60"]
      deploy_slack_mcp:
        description: "Deploy Slack MCP gateway after analytics agent"
        required: true
        default: false
        type: boolean

concurrency:
  group: session-start-${{ inputs.env }}
  cancel-in-progress: false

# ── Job 1: Apply all AWS infrastructure ──────────────────────────────────────

jobs:
  terraform-apply:
    name: Apply infrastructure (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    outputs:
      alb_dns:                           ${{ steps.tf-outputs.outputs.alb_dns }}
      account_id:                        ${{ steps.account.outputs.id }}
      cdc_simulator_ecr_url:             ${{ steps.tf-outputs.outputs.cdc_simulator_ecr_url }}
      cdc_simulator_cluster:             ${{ steps.tf-outputs.outputs.cdc_simulator_cluster }}
      cdc_simulator_task_definition:     ${{ steps.tf-outputs.outputs.cdc_simulator_task_definition }}
      cdc_simulator_container_name:      ${{ steps.tf-outputs.outputs.cdc_simulator_container_name }}
      cdc_simulator_security_group_id:   ${{ steps.tf-outputs.outputs.cdc_simulator_security_group_id }}
      cdc_simulator_private_subnet_ids:  ${{ steps.tf-outputs.outputs.cdc_simulator_private_subnet_ids }}
      dms_replication_task_arn:          ${{ steps.tf-outputs.outputs.dms_replication_task_arn }}
      rds_identifier:                    ${{ steps.tf-outputs.outputs.rds_identifier }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout terraform-platform-infra-live
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/terraform-platform-infra-live
          token: ${{ secrets.GH_PAT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        run: |
          cd environments/${{ env.ENV }}
          terraform init

      - name: Terraform apply
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || inputs.db_password }}
          REDSHIFT_ADMIN_PASSWORD: ${{ secrets.REDSHIFT_ADMIN_PASSWORD || inputs.redshift_admin_password }}
        run: |
          cd environments/${{ env.ENV }}
          if [ "${{ inputs.run_cdc_simulator }}" = "true" ]; then
            if [ -z "${DB_PASSWORD}" ]; then
              echo "DB_PASSWORD is required when run_cdc_simulator=true."
              exit 1
            fi
            export TF_VAR_enable_cdc_simulator=true
            export TF_VAR_db_password="${DB_PASSWORD}"
            echo "CDC simulator infrastructure enabled for this session."
          else
            export TF_VAR_enable_cdc_simulator=false
            echo "CDC simulator infrastructure disabled for this session."
          fi
          if [ "${{ inputs.serving_layer }}" = "redshift-bi" ]; then
            if [ -z "${REDSHIFT_ADMIN_PASSWORD}" ]; then
              echo "REDSHIFT_ADMIN_PASSWORD is required when serving_layer=redshift-bi."
              exit 1
            fi
            export TF_VAR_enable_serving=true
            export TF_VAR_redshift_admin_password="${REDSHIFT_ADMIN_PASSWORD}"
            echo "Redshift Serverless serving layer enabled for BI."
          else
            export TF_VAR_enable_serving=false
            echo "Athena/S3 serving only. Redshift Serverless disabled for this session."
          fi
          if [ "${{ inputs.deploy_slack_mcp }}" = "true" ]; then
            export TF_VAR_enable_slack_mcp_gateway=true
            export TF_VAR_slack_mcp_desired_count=0
            echo "Slack MCP gateway infrastructure enabled. ECS service starts after image deploy."
          else
            export TF_VAR_enable_slack_mcp_gateway=false
            echo "Slack MCP gateway infrastructure disabled for this session."
          fi
          terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf-outputs
        run: |
          cd environments/${{ env.ENV }}
          optional_output() {
            terraform output -raw "$1" 2>/dev/null || true
          }
          echo "alb_dns=$(optional_output analytics_agent_alb_dns)" >> "$GITHUB_OUTPUT"
          echo "cdc_simulator_ecr_url=$(optional_output cdc_simulator_ecr_url)" >> "$GITHUB_OUTPUT"
          echo "cdc_simulator_cluster=$(optional_output cdc_simulator_cluster)" >> "$GITHUB_OUTPUT"
          echo "cdc_simulator_task_definition=$(optional_output cdc_simulator_task_definition)" >> "$GITHUB_OUTPUT"
          echo "cdc_simulator_container_name=$(optional_output cdc_simulator_container_name)" >> "$GITHUB_OUTPUT"
          echo "cdc_simulator_security_group_id=$(optional_output cdc_simulator_security_group_id)" >> "$GITHUB_OUTPUT"
          echo "dms_replication_task_arn=$(optional_output dms_replication_task_arn)" >> "$GITHUB_OUTPUT"
          echo "rds_identifier=$(optional_output rds_identifier)" >> "$GITHUB_OUTPUT"
          {
            echo "cdc_simulator_private_subnet_ids<<JSON"
            terraform output -json cdc_simulator_private_subnet_ids 2>/dev/null | jq -c '. // []' || echo "[]"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

# ── Job 2: Prepare CDC source data (optional, selected at workflow dispatch) ─

  cdc-source-ready:
    name: CDC source ready (${{ inputs.env }})
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Skip when CDC simulator is disabled
        if: ${{ !inputs.run_cdc_simulator }}
        run: echo "run_cdc_simulator=false. Continuing without source bootstrap."

      - name: Checkout platform-cdc-simulator
        if: ${{ inputs.run_cdc_simulator }}
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-cdc-simulator
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.run_cdc_simulator }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.terraform-apply.outputs.account_id }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ inputs.run_cdc_simulator }}
        id: login-ecr-cdc
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push simulator image
        if: ${{ inputs.run_cdc_simulator }}
        id: build-cdc-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-cdc.outputs.registry }}
          ECR_REPOSITORY: edp-${{ env.ENV }}-cdc-simulator
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Register simulator task definition revision
        if: ${{ inputs.run_cdc_simulator }}
        id: cdc-task-def
        env:
          TASK_DEFINITION: ${{ needs.terraform-apply.outputs.cdc_simulator_task_definition }}
          CONTAINER_NAME: ${{ needs.terraform-apply.outputs.cdc_simulator_container_name }}
          IMAGE_URI: ${{ steps.build-cdc-image.outputs.image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_DEFINITION}" \
            --query taskDefinition \
            > task-definition.json

          jq --arg IMAGE_URI "${IMAGE_URI}" --arg CONTAINER_NAME "${CONTAINER_NAME}" '
            .containerDefinitions |= map(
              if .name == $CONTAINER_NAME then .image = $IMAGE_URI else . end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy
              )
          ' task-definition.json > register-task-definition.json

          REGISTERED_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://register-task-definition.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)
          echo "task_definition=${REGISTERED_ARN}" >> "$GITHUB_OUTPUT"
          echo "Registered ${REGISTERED_ARN}"

      - name: Reboot RDS so logical replication parameters are active
        if: ${{ inputs.run_cdc_simulator }}
        env:
          RDS_IDENTIFIER: ${{ needs.terraform-apply.outputs.rds_identifier }}
        run: |
          aws rds reboot-db-instance \
            --db-instance-identifier "${RDS_IDENTIFIER}" \
            >/dev/null
          aws rds wait db-instance-available \
            --db-instance-identifier "${RDS_IDENTIFIER}"
          echo "RDS ${RDS_IDENTIFIER} is available after reboot."

      - name: Run schema + seed bootstrap task
        if: ${{ inputs.run_cdc_simulator }}
        id: cdc-bootstrap
        env:
          CLUSTER: ${{ needs.terraform-apply.outputs.cdc_simulator_cluster }}
          TASK_DEFINITION: ${{ steps.cdc-task-def.outputs.task_definition }}
          CONTAINER_NAME: ${{ needs.terraform-apply.outputs.cdc_simulator_container_name }}
          SECURITY_GROUP_ID: ${{ needs.terraform-apply.outputs.cdc_simulator_security_group_id }}
          PRIVATE_SUBNET_IDS: ${{ needs.terraform-apply.outputs.cdc_simulator_private_subnet_ids }}
        run: |
          SUBNETS=$(jq -cer 'if type == "array" then join(",") else error("PRIVATE_SUBNET_IDS must be a JSON array") end' <<< "${PRIVATE_SUBNET_IDS}")
          NETWORK_CONFIG="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP_ID}],assignPublicIp=DISABLED}"
          OVERRIDES=$(jq -cn \
            --arg name "${CONTAINER_NAME}" \
            '{containerOverrides:[{name:$name,command:["bootstrap"]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_DEFINITION}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIG}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "${TASK_ARN}" ] || [ "${TASK_ARN}" = "None" ]; then
            echo "Failed to start CDC bootstrap task."
            exit 1
          fi

          echo "Started CDC bootstrap task ${TASK_ARN}"
          aws ecs wait tasks-stopped --cluster "${CLUSTER}" --tasks "${TASK_ARN}"
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "${CLUSTER}" \
            --tasks "${TASK_ARN}" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          if [ "${EXIT_CODE}" != "0" ]; then
            echo "CDC bootstrap task failed with exit code ${EXIT_CODE}."
            exit 1
          fi

      - name: Start DMS full-load and CDC task
        if: ${{ inputs.run_cdc_simulator }}
        env:
          DMS_TASK_ARN: ${{ needs.terraform-apply.outputs.dms_replication_task_arn }}
        run: |
          set +e
          OUTPUT=$(aws dms start-replication-task \
            --replication-task-arn "${DMS_TASK_ARN}" \
            --start-replication-task-type start-replication 2>&1)
          STATUS=$?
          set -e
          if [ "${STATUS}" -ne 0 ]; then
            if echo "${OUTPUT}" | grep -qi "InvalidResourceStateFault"; then
              echo "DMS task is already started or not in a startable state. Continuing to readiness check."
            else
              echo "${OUTPUT}"
              exit "${STATUS}"
            fi
          else
            echo "DMS replication task started."
          fi

      - name: Wait for seeded Bronze data in S3
        if: ${{ inputs.run_cdc_simulator }}
        env:
          ACCOUNT_ID: ${{ needs.terraform-apply.outputs.account_id }}
        run: |
          BUCKET="edp-${ENV}-${ACCOUNT_ID}-bronze"
          TABLES="customers products orders order_items payments shipments"
          MAX_ATTEMPTS=40
          SLEEP_SECONDS=30

          for attempt in $(seq 1 "${MAX_ATTEMPTS}"); do
            echo "Bronze readiness check ${attempt}/${MAX_ATTEMPTS}"
            MISSING=""
            for table in ${TABLES}; do
              if ! aws s3 ls "s3://${BUCKET}/raw/public/${table}/" --recursive | grep -q ".parquet"; then
                MISSING="${MISSING} ${table}"
              fi
            done

            if [ -z "${MISSING}" ]; then
              echo "Bronze has Parquet files for all source tables."
              exit 0
            fi

            echo "Still waiting for:${MISSING}"
            sleep "${SLEEP_SECONDS}"
          done

          echo "Timed out waiting for DMS to land seeded data in Bronze."
          exit 1

      - name: Start bounded live injection task
        if: ${{ inputs.run_cdc_simulator }}
        env:
          CLUSTER: ${{ needs.terraform-apply.outputs.cdc_simulator_cluster }}
          TASK_DEFINITION: ${{ steps.cdc-task-def.outputs.task_definition }}
          CONTAINER_NAME: ${{ needs.terraform-apply.outputs.cdc_simulator_container_name }}
          SECURITY_GROUP_ID: ${{ needs.terraform-apply.outputs.cdc_simulator_security_group_id }}
          PRIVATE_SUBNET_IDS: ${{ needs.terraform-apply.outputs.cdc_simulator_private_subnet_ids }}
          DURATION_MINUTES: ${{ inputs.cdc_simulator_duration_minutes }}
        run: |
          DURATION_SECONDS=$((DURATION_MINUTES * 60))
          SUBNETS=$(jq -cer 'if type == "array" then join(",") else error("PRIVATE_SUBNET_IDS must be a JSON array") end' <<< "${PRIVATE_SUBNET_IDS}")
          NETWORK_CONFIG="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP_ID}],assignPublicIp=DISABLED}"
          OVERRIDES=$(jq -cn \
            --arg name "${CONTAINER_NAME}" \
            --arg duration "${DURATION_SECONDS}" \
            '{containerOverrides:[{name:$name,command:["simulate","--duration-seconds",$duration]}]}')

          TASK_ARN=$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${TASK_DEFINITION}" \
            --launch-type FARGATE \
            --network-configuration "${NETWORK_CONFIG}" \
            --overrides "${OVERRIDES}" \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Started bounded live CDC injection task: ${TASK_ARN}"
          echo "Workflow will continue while this task runs for ${DURATION_SECONDS}s."

# ── Job 3: Upload Glue scripts to S3 (parallel after terraform-apply) ────────
# Uploads all six Silver PySpark job scripts, run_dbt.py, and the shared lib.zip
# to the Glue scripts S3 bucket. This must run every session because
# terraform-apply recreates the bucket from scratch, wiping any previously
# uploaded scripts. The platform-glue-jobs deploy workflow runs on push to main
# but the bucket may not exist at that point, so the session orchestrator is the
# only reliable place to guarantee scripts are current before the pipeline runs.

  deploy-glue-scripts:
    name: Upload Glue scripts to S3 (${{ inputs.env }})
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout platform-glue-jobs
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-glue-jobs
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Package shared lib/
        run: zip -r lib.zip lib/ -x "lib/__pycache__/*" -x "lib/*.pyc"

      - name: Upload job scripts and lib.zip to S3
        env:
          SCRIPTS_BUCKET: edp-${{ env.ENV }}-${{ steps.account.outputs.id }}-glue-scripts
        run: |
          aws s3 sync jobs/ "s3://${SCRIPTS_BUCKET}/glue-scripts/" \
            --exclude "*" --include "*.py"
          aws s3 cp lib.zip "s3://${SCRIPTS_BUCKET}/glue-scripts/lib.zip"
          echo "Glue scripts uploaded to s3://${SCRIPTS_BUCKET}/glue-scripts/"
          aws s3 ls "s3://${SCRIPTS_BUCKET}/glue-scripts/"

# ── Job 3: Sync dbt project to S3 (parallel after terraform-apply) ───────────
# Step Functions: syncs to s3://{bronze-bucket}/dbt/platform-dbt-analytics/
#   The run_dbt Glue job downloads it from there at runtime.
# MWAA: syncs to s3://{mwaa-dags-bucket}/dbt/platform-dbt-analytics/
#   The Airflow BashOperator downloads it from there at runtime.

  sync-dbt:
    name: Sync dbt project to S3 (${{ inputs.env }})
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout platform-dbt-analytics
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-dbt-analytics
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set dbt S3 destination
        id: dbt-dest
        env:
          ACCOUNT_ID: ${{ needs.terraform-apply.outputs.account_id }}
        run: |
          if [ "${{ inputs.orchestrator }}" = "step-functions" ]; then
            echo "bucket=edp-${{ env.ENV }}-${ACCOUNT_ID}-bronze" >> "$GITHUB_OUTPUT"
          else
            echo "bucket=edp-${{ env.ENV }}-${ACCOUNT_ID}-mwaa-dags" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync dbt project to S3
        run: |
          aws s3 sync . "s3://${{ steps.dbt-dest.outputs.bucket }}/dbt/platform-dbt-analytics/" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "__pycache__/*" \
            --exclude ".venv/*" \
            --exclude "target/*" \
            --exclude "dbt_packages/*" \
            --exclude "logs/*"
          echo "dbt project synced to s3://${{ steps.dbt-dest.outputs.bucket }}/dbt/platform-dbt-analytics/"

# ── Job 4: Upload DAG to MWAA (MWAA only, parallel after terraform-apply) ────

  upload-dag:
    name: Upload DAG to MWAA (${{ inputs.env }})
    if: ${{ inputs.orchestrator == 'mwaa' }}
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:           ${{ inputs.env }}
      AWS_REGION:    eu-central-1
      MWAA_ENV_NAME: edp-${{ inputs.env }}-mwaa

    steps:
      - name: Checkout platform-orchestration-mwaa-airflow
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-orchestration-mwaa-airflow
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Assert MWAA is AVAILABLE
        run: |
          STATUS=$(aws mwaa get-environment \
            --name "${MWAA_ENV_NAME}" \
            --query "Environment.Status" \
            --output text)
          echo "MWAA status: ${STATUS}"
          if [ "${STATUS}" != "AVAILABLE" ]; then
            echo "MWAA is ${STATUS}. Expected AVAILABLE after terraform apply."
            exit 1
          fi

      - name: Upload dags/ to S3
        env:
          MWAA_BUCKET: edp-${{ env.ENV }}-${{ needs.terraform-apply.outputs.account_id }}-mwaa-dags
        run: |
          aws s3 sync dags/ "s3://${MWAA_BUCKET}/dags/" \
            --delete \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"
          echo "DAGs uploaded to s3://${MWAA_BUCKET}/dags/"

# ── Job 5: Trigger Step Functions pipeline and poll until completion ──────────

  trigger-step-functions:
    name: Run Step Functions pipeline (${{ inputs.env }})
    if: ${{ inputs.orchestrator == 'step-functions' }}
    needs: [sync-dbt, deploy-glue-scripts, cdc-source-ready, terraform-apply]
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Step Functions execution
        id: start-execution
        env:
          ACCOUNT_ID: ${{ needs.terraform-apply.outputs.account_id || vars.AWS_ACCOUNT_ID }}
        run: |
          STATE_MACHINE_ARN="arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:edp-${ENV}-pipeline"
          echo "Starting execution: ${STATE_MACHINE_ARN}"

          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --query executionArn \
            --output text)

          echo "execution_arn=${EXECUTION_ARN}" >> "$GITHUB_OUTPUT"
          echo "Execution started: ${EXECUTION_ARN}"

      - name: Poll until success or failure (timeout 30 min)
        run: |
          EXECUTION_ARN="${{ steps.start-execution.outputs.execution_arn }}"
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=30
          ATTEMPT=0

          while [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Poll ${ATTEMPT}/${MAX_ATTEMPTS} — $(date -u '+%H:%M:%S UTC')"

            STATUS=$(aws stepfunctions describe-execution \
              --execution-arn "${EXECUTION_ARN}" \
              --query status \
              --output text)

            echo "  Status: ${STATUS}"

            case "${STATUS}" in
              SUCCEEDED)
                echo "Pipeline completed successfully."
                exit 0
                ;;
              FAILED|TIMED_OUT|ABORTED)
                echo "Pipeline ${STATUS}. Check the Step Functions console for details."
                exit 1
                ;;
              RUNNING)
                echo "  Still running. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
              *)
                echo "  Unexpected status '${STATUS}'. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
            esac
          done

          echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          exit 1

# ── Job 6: Trigger MWAA DAG and poll until completion (MWAA only) ─────────────

  trigger-mwaa:
    name: Run edp_pipeline DAG (${{ inputs.env }})
    if: ${{ inputs.orchestrator == 'mwaa' }}
    needs: [sync-dbt, upload-dag, deploy-glue-scripts, cdc-source-ready]
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:           ${{ inputs.env }}
      AWS_REGION:    eu-central-1
      MWAA_ENV_NAME: edp-${{ inputs.env }}-mwaa

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for edp_pipeline DAG to be registered by scheduler
        run: |
          MAX_WAIT=18
          FOUND=0

          for i in $(seq 1 "${MAX_WAIT}"); do
            RESPONSE=$(aws mwaa create-cli-token \
              --name "${MWAA_ENV_NAME}" \
              --output json)
            CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
            WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

            RAW=$(curl -s \
              -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
              -H "Authorization: Bearer ${CLI_TOKEN}" \
              -H "Content-Type: text/plain" \
              --data "dags list -o json" \
              | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || echo "")

            if echo "${RAW}" | python3 -c "
          import sys, json
          try:
              dags = json.loads(sys.stdin.read())
              ids = [d.get('dag_id','') for d in dags]
              print('found' if 'edp_pipeline' in ids else 'not_found')
          except Exception:
              print('not_found')
          " | grep -q found; then
              echo "edp_pipeline registered (attempt ${i}/${MAX_WAIT})."
              FOUND=1
              break
            fi

            echo "Attempt ${i}/${MAX_WAIT}: DAG not yet registered. Waiting 10s..."
            sleep 10
          done

          if [ "${FOUND}" -eq 0 ]; then
            echo "edp_pipeline did not appear in Airflow within 3 minutes."
            exit 1
          fi

      - name: Unpause edp_pipeline DAG
        run: |
          RESPONSE=$(aws mwaa create-cli-token \
            --name "${MWAA_ENV_NAME}" \
            --output json)
          CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
          WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

          curl -s -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
            -H "Authorization: Bearer ${CLI_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data "dags unpause edp_pipeline" | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || true

      - name: Trigger edp_pipeline DAG via MWAA CLI
        run: |
          RESPONSE=$(aws mwaa create-cli-token \
            --name "${MWAA_ENV_NAME}" \
            --output json)
          CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
          WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

          HTTP_STATUS=$(curl -s \
            -o /tmp/trigger_out.json \
            -w "%{http_code}" \
            -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
            -H "Authorization: Bearer ${CLI_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data "dags trigger edp_pipeline")

          echo "HTTP status: ${HTTP_STATUS}"
          STDOUT=""
          STDERR=""
          if [ -s /tmp/trigger_out.json ]; then
            STDOUT=$(jq -r '.stdout // ""' /tmp/trigger_out.json | base64 --decode 2>/dev/null || true)
            STDERR=$(jq -r '.stderr // ""' /tmp/trigger_out.json | base64 --decode 2>/dev/null || true)
            [ -n "${STDOUT}" ] && echo "stdout: ${STDOUT}"
            [ -n "${STDERR}" ] && echo "stderr: ${STDERR}"
          fi

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "DAG trigger failed (HTTP ${HTTP_STATUS})."
            exit 1
          fi

          if echo "${STDERR}" | grep -qi "error\|exception\|failed\|not found"; then
            echo "Airflow CLI returned an error. Trigger did not succeed."
            exit 1
          fi

          echo "edp_pipeline triggered. Verifying run was created (up to 25s)..."
          RUN_FOUND=0
          for i in 1 2 3 4 5; do
            sleep 5
            VERIFY_RESP=$(aws mwaa create-cli-token \
              --name "${MWAA_ENV_NAME}" \
              --output json)
            VERIFY_TOKEN=$(echo "${VERIFY_RESP}" | jq -r '.CliToken')
            VERIFY_HOST=$(echo "${VERIFY_RESP}" | jq -r '.WebServerHostname')
            RAW=$(curl -s \
              -X POST "https://${VERIFY_HOST}/aws_mwaa/cli" \
              -H "Authorization: Bearer ${VERIFY_TOKEN}" \
              -H "Content-Type: text/plain" \
              --data "dags list-runs --dag-id edp_pipeline -o json" \
              | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || echo "")
            STATE=$(echo "${RAW}" | python3 -c "
          import sys, json
          try:
              runs = json.loads(sys.stdin.read())
              print(runs[0].get('state','unknown') if runs else 'no_runs')
          except Exception:
              print('no_runs')
          " 2>/dev/null || echo "no_runs")
            echo "  Verify attempt ${i}/5: state=${STATE}"
            if [ "${STATE}" != "no_runs" ]; then
              RUN_FOUND=1
              break
            fi
          done

          if [ "${RUN_FOUND}" -eq 0 ]; then
            echo "DAG run was not created within 25s of trigger."
            exit 1
          fi

      - name: Poll edp_pipeline until success or failure (timeout 30 min)
        run: |
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=30
          ATTEMPT=0

          while [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Poll ${ATTEMPT}/${MAX_ATTEMPTS} — $(date -u '+%H:%M:%S UTC')"

            RESPONSE=$(aws mwaa create-cli-token \
              --name "${MWAA_ENV_NAME}" \
              --output json)
            CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
            WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

            HTTP_STATUS=$(curl -s \
              -o /tmp/poll_out.json \
              -w "%{http_code}" \
              -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
              -H "Authorization: Bearer ${CLI_TOKEN}" \
              -H "Content-Type: text/plain" \
              --data "dags list-runs --dag-id edp_pipeline -o json")

            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "  Poll request failed (HTTP ${HTTP_STATUS}), retrying..."
              sleep "${SLEEP_SECONDS}"
              continue
            fi

            RAW=$(jq -r '.stdout // ""' /tmp/poll_out.json | base64 --decode 2>/dev/null || echo "")

            STATE=$(echo "${RAW}" | python3 -c "
          import sys, json
          try:
              runs = json.loads(sys.stdin.read())
              if runs:
                  print(runs[0].get('state', 'unknown'))
              else:
                  print('no_runs')
          except Exception:
              print('parse_error')
          " 2>/dev/null || echo "unknown")

            echo "  Most recent run state: ${STATE}"

            case "${STATE}" in
              success)
                echo "edp_pipeline completed successfully."
                exit 0
                ;;
              failed)
                echo "edp_pipeline FAILED. Check the MWAA Airflow UI for task logs."
                exit 1
                ;;
              running|queued|no_runs|unknown|parse_error)
                echo "  Still in progress. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
              *)
                echo "  Unexpected state '${STATE}'. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
            esac
          done

          echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          exit 1

# ── Job 7: Build and deploy analytics agent ───────────────────────────────────
# Runs after whichever trigger job ran. The skipped job counts as success
# for the needs check, so deploy-agent runs when either job completes.

  deploy-agent:
    name: Build and deploy analytics agent (${{ inputs.env }})
    needs: [trigger-step-functions, trigger-mwaa]
    if: ${{ always() && (needs.trigger-step-functions.result == 'success' || needs.trigger-mwaa.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:            ${{ inputs.env }}
      AWS_REGION:     eu-central-1
      CONTAINER_NAME: agent

    steps:
      - name: Checkout platform-analytics-agent
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-analytics-agent
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: edp-${{ env.ENV }}-analytics-agent
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --target runtime \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-analytics-agent
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-analytics-agent
          cluster:                    edp-${{ env.ENV }}-analytics-agent
          wait-for-service-stability: true

# ── Job 8: Optionally build and deploy Slack MCP gateway ─────────────────────

  deploy-slack-mcp:
    name: Build and deploy Slack MCP gateway (${{ inputs.env }})
    needs: [terraform-apply, deploy-agent]
    if: ${{ always() && needs.deploy-agent.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:            ${{ inputs.env }}
      AWS_REGION:     eu-central-1
      CONTAINER_NAME: gateway

    steps:
      - name: Skip when Slack MCP is disabled
        if: ${{ !inputs.deploy_slack_mcp }}
        run: echo "deploy_slack_mcp is false. Skipping Slack MCP gateway deploy."

      - name: Checkout platform-slack-mcp-gateway
        if: ${{ inputs.deploy_slack_mcp }}
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-slack-mcp-gateway
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.deploy_slack_mcp }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.terraform-apply.outputs.account_id }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Seed Slack tokens into Secrets Manager
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "/edp/${ENV}/slack_mcp/slack_app_token" \
            --secret-string "${SLACK_APP_TOKEN}" \
            >/dev/null
          aws secretsmanager put-secret-value \
            --secret-id "/edp/${ENV}/slack_mcp/slack_bot_token" \
            --secret-string "${SLACK_BOT_TOKEN}" \
            >/dev/null
          echo "Slack tokens seeded into Secrets Manager."

      - name: Log in to Amazon ECR
        if: ${{ inputs.deploy_slack_mcp }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        if: ${{ inputs.deploy_slack_mcp }}
        id: build-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: edp-${{ env.ENV }}-slack-mcp-gateway
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-slack-mcp-gateway
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        if: ${{ inputs.deploy_slack_mcp }}
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        if: ${{ inputs.deploy_slack_mcp }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-slack-mcp-gateway
          cluster:                    edp-${{ env.ENV }}-slack-mcp-gateway
          wait-for-service-stability: false

      - name: Scale Slack MCP gateway to one task
        if: ${{ inputs.deploy_slack_mcp }}
        run: |
          aws ecs update-service \
            --cluster "edp-${ENV}-slack-mcp-gateway" \
            --service "edp-${ENV}-slack-mcp-gateway" \
            --desired-count 1 \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "edp-${ENV}-slack-mcp-gateway" \
            --services "edp-${ENV}-slack-mcp-gateway"
          echo "Slack MCP gateway deployed and stable."

# ── Job 9: Session ready — print access URLs ──────────────────────────────────

  session-ready:
    name: Session ready
    needs: [terraform-apply, deploy-agent, deploy-slack-mcp]
    if: ${{ always() && needs.deploy-agent.result == 'success' && needs.deploy-slack-mcp.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Print session summary
        env:
          ENV:          ${{ inputs.env }}
          ORCHESTRATOR: ${{ inputs.orchestrator }}
          SERVING_LAYER: ${{ inputs.serving_layer }}
          DEPLOY_SLACK_MCP: ${{ inputs.deploy_slack_mcp }}
          ALB_DNS:      ${{ needs.terraform-apply.outputs.alb_dns }}
        run: |
          echo ""
          echo "================================================"
          echo "  SESSION IS READY"
          echo "================================================"
          echo ""
          echo "  Environment  : ${ENV}"
          echo "  Orchestrator : ${ORCHESTRATOR}"
          echo "  Serving layer: ${SERVING_LAYER}"
          echo ""
          echo "  Streamlit UI (open in browser from within VPC):"
          echo "    http://${ALB_DNS}:8501"
          echo ""
          echo "  FastAPI (curl from within VPC):"
          echo "    curl -s -X POST http://${ALB_DNS}/ask \\"
          echo "      -H 'Content-Type: application/json' \\"
          echo "      -d '{\"question\": \"Which country has the highest revenue?\"}'"
          echo ""
          if [ "${DEPLOY_SLACK_MCP}" = "true" ]; then
            echo "  Slack MCP Gateway:"
            echo "    Deployed. Ask @EDP Analytics Agent in #analytics-agent-demo."
            echo ""
          fi
          echo "  When done: run the Session Destroy workflow."
          echo "  Cost so far: ~\$0.30-\$0.50 (infra up, no queries yet)"
          echo ""
          echo "================================================"
