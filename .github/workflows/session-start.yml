name: Session Start

# Orchestrates a full EDP (Enterprise Data Platform) session from scratch.
#
# Dependency order:
#
#   terraform-apply (~5 min for Step Functions, ~25 min for MWAA)
#       |
#       |--- sync-dbt (seconds) ──────────────────────────────\
#       |--- upload-dag (MWAA only, seconds) ─────────────────+──> trigger-pipeline (~10 min)
#                                                                           |
#                                                                     deploy-agent (~5 min)
#                                                                           |
#                                                                     session-ready
#
# Orchestrator choices:
#   step-functions (default): Step Functions state machine. No separate DAG upload.
#     Fast: no 25-min MWAA startup wait. Run this for every dev session.
#   mwaa: Full MWAA Airflow environment with visual task dependency graph in the Airflow UI.
#     Use this when a visual task graph or full Airflow capabilities are needed.
#
# Prerequisites (one-time setup):
#   1. terraform-bootstrap applied — creates OIDC provider and github-actions-role.
#   2. terraform-github-setup applied — creates GitHub Environments (dev/staging/prod)
#      and the AWS_ACCOUNT_ID repository variable in this repo.
#   3. GH_PAT repository secret — a GitHub Personal Access Token with repo scope,
#      used to check out other repos in the org during this workflow.
#
# Required secrets / variables (Settings -> Secrets and variables -> Actions):
#   Secrets:
#     GH_PAT          — GitHub PAT with repo scope (for cross-repo checkout)
#     SLACK_APP_TOKEN — Slack Socket Mode app token, required only when deploy_slack_mcp=true
#     SLACK_BOT_TOKEN — Slack bot token, required only when deploy_slack_mcp=true
#   Variables (per Environment: dev / staging / prod):
#     AWS_ACCOUNT_ID  — 12-digit AWS account ID (not sensitive, used in resource names)

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Target environment"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      orchestrator:
        description: "Orchestrator (step-functions for fast startup, mwaa for Airflow UI with visual task graph)"
        required: true
        default: step-functions
        type: choice
        options: [step-functions, mwaa]
      db_password:
        description: "RDS master password (only needed when module ingestion is enabled)"
        required: false
        type: string
      deploy_slack_mcp:
        description: "Deploy Slack MCP gateway after analytics agent"
        required: true
        default: false
        type: boolean

# ── Job 1: Apply all AWS infrastructure ──────────────────────────────────────

jobs:
  terraform-apply:
    name: Apply infrastructure (${{ inputs.env }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    outputs:
      alb_dns:    ${{ steps.tf-outputs.outputs.alb_dns }}
      account_id: ${{ steps.account.outputs.id }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout terraform-platform-infra-live
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/terraform-platform-infra-live
          token: ${{ secrets.GH_PAT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        run: |
          cd environments/${{ env.ENV }}
          terraform init

      - name: Terraform apply
        run: |
          cd environments/${{ env.ENV }}
          if [ "${{ inputs.deploy_slack_mcp }}" = "true" ]; then
            export TF_VAR_enable_slack_mcp_gateway=true
            export TF_VAR_slack_mcp_desired_count=0
            echo "Slack MCP gateway infrastructure enabled. ECS service starts after image deploy."
          else
            export TF_VAR_enable_slack_mcp_gateway=false
            echo "Slack MCP gateway infrastructure disabled for this session."
          fi
          terraform apply -auto-approve

      - name: Capture Terraform outputs
        id: tf-outputs
        run: |
          cd environments/${{ env.ENV }}
          echo "alb_dns=$(terraform output -raw analytics_agent_alb_dns)" >> "$GITHUB_OUTPUT"

# ── Job 2: Sync dbt project to S3 (parallel after terraform-apply) ───────────
# Step Functions: syncs to s3://{bronze-bucket}/dbt/platform-dbt-analytics/
#   The run_dbt Glue job downloads it from there at runtime.
# MWAA: syncs to s3://{mwaa-dags-bucket}/dbt/platform-dbt-analytics/
#   The Airflow BashOperator downloads it from there at runtime.

  sync-dbt:
    name: Sync dbt project to S3 (${{ inputs.env }})
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Checkout platform-dbt-analytics
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-dbt-analytics
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Set dbt S3 destination
        id: dbt-dest
        env:
          ACCOUNT_ID: ${{ needs.terraform-apply.outputs.account_id }}
        run: |
          if [ "${{ inputs.orchestrator }}" = "step-functions" ]; then
            echo "bucket=edp-${{ env.ENV }}-${ACCOUNT_ID}-bronze" >> "$GITHUB_OUTPUT"
          else
            echo "bucket=edp-${{ env.ENV }}-${ACCOUNT_ID}-mwaa-dags" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync dbt project to S3
        run: |
          aws s3 sync . "s3://${{ steps.dbt-dest.outputs.bucket }}/dbt/platform-dbt-analytics/" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "__pycache__/*" \
            --exclude ".venv/*" \
            --exclude "target/*" \
            --exclude "dbt_packages/*" \
            --exclude "logs/*"
          echo "dbt project synced to s3://${{ steps.dbt-dest.outputs.bucket }}/dbt/platform-dbt-analytics/"

# ── Job 3: Upload DAG to MWAA (MWAA only, parallel after terraform-apply) ────

  upload-dag:
    name: Upload DAG to MWAA (${{ inputs.env }})
    if: ${{ inputs.orchestrator == 'mwaa' }}
    needs: terraform-apply
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:           ${{ inputs.env }}
      AWS_REGION:    eu-central-1
      MWAA_ENV_NAME: edp-${{ inputs.env }}-mwaa

    steps:
      - name: Checkout platform-orchestration-mwaa-airflow
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-orchestration-mwaa-airflow
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Assert MWAA is AVAILABLE
        run: |
          STATUS=$(aws mwaa get-environment \
            --name "${MWAA_ENV_NAME}" \
            --query "Environment.Status" \
            --output text)
          echo "MWAA status: ${STATUS}"
          if [ "${STATUS}" != "AVAILABLE" ]; then
            echo "MWAA is ${STATUS}. Expected AVAILABLE after terraform apply."
            exit 1
          fi

      - name: Upload dags/ to S3
        env:
          MWAA_BUCKET: edp-${{ env.ENV }}-${{ needs.terraform-apply.outputs.account_id }}-mwaa-dags
        run: |
          aws s3 sync dags/ "s3://${MWAA_BUCKET}/dags/" \
            --delete \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"
          echo "DAGs uploaded to s3://${MWAA_BUCKET}/dags/"

# ── Job 4: Trigger Step Functions pipeline and poll until completion ──────────

  trigger-step-functions:
    name: Run Step Functions pipeline (${{ inputs.env }})
    if: ${{ inputs.orchestrator == 'step-functions' }}
    needs: [sync-dbt]
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:        ${{ inputs.env }}
      AWS_REGION: eu-central-1

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Start Step Functions execution
        id: start-execution
        env:
          ACCOUNT_ID: ${{ needs.terraform-apply.outputs.account_id || vars.AWS_ACCOUNT_ID }}
        run: |
          STATE_MACHINE_ARN="arn:aws:states:${AWS_REGION}:${ACCOUNT_ID}:stateMachine:edp-${ENV}-pipeline"
          echo "Starting execution: ${STATE_MACHINE_ARN}"

          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --query executionArn \
            --output text)

          echo "execution_arn=${EXECUTION_ARN}" >> "$GITHUB_OUTPUT"
          echo "Execution started: ${EXECUTION_ARN}"

      - name: Poll until success or failure (timeout 30 min)
        run: |
          EXECUTION_ARN="${{ steps.start-execution.outputs.execution_arn }}"
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=30
          ATTEMPT=0

          while [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Poll ${ATTEMPT}/${MAX_ATTEMPTS} — $(date -u '+%H:%M:%S UTC')"

            STATUS=$(aws stepfunctions describe-execution \
              --execution-arn "${EXECUTION_ARN}" \
              --query status \
              --output text)

            echo "  Status: ${STATUS}"

            case "${STATUS}" in
              SUCCEEDED)
                echo "Pipeline completed successfully."
                exit 0
                ;;
              FAILED|TIMED_OUT|ABORTED)
                echo "Pipeline ${STATUS}. Check the Step Functions console for details."
                exit 1
                ;;
              RUNNING)
                echo "  Still running. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
              *)
                echo "  Unexpected status '${STATUS}'. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
            esac
          done

          echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          exit 1

# ── Job 5: Trigger MWAA DAG and poll until completion (MWAA only) ─────────────

  trigger-mwaa:
    name: Run edp_pipeline DAG (${{ inputs.env }})
    if: ${{ inputs.orchestrator == 'mwaa' }}
    needs: [sync-dbt, upload-dag]
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:           ${{ inputs.env }}
      AWS_REGION:    eu-central-1
      MWAA_ENV_NAME: edp-${{ inputs.env }}-mwaa

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Wait for edp_pipeline DAG to be registered by scheduler
        run: |
          MAX_WAIT=18
          FOUND=0

          for i in $(seq 1 "${MAX_WAIT}"); do
            RESPONSE=$(aws mwaa create-cli-token \
              --name "${MWAA_ENV_NAME}" \
              --output json)
            CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
            WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

            RAW=$(curl -s \
              -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
              -H "Authorization: Bearer ${CLI_TOKEN}" \
              -H "Content-Type: text/plain" \
              --data "dags list -o json" \
              | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || echo "")

            if echo "${RAW}" | python3 -c "
          import sys, json
          try:
              dags = json.loads(sys.stdin.read())
              ids = [d.get('dag_id','') for d in dags]
              print('found' if 'edp_pipeline' in ids else 'not_found')
          except Exception:
              print('not_found')
          " | grep -q found; then
              echo "edp_pipeline registered (attempt ${i}/${MAX_WAIT})."
              FOUND=1
              break
            fi

            echo "Attempt ${i}/${MAX_WAIT}: DAG not yet registered. Waiting 10s..."
            sleep 10
          done

          if [ "${FOUND}" -eq 0 ]; then
            echo "edp_pipeline did not appear in Airflow within 3 minutes."
            exit 1
          fi

      - name: Unpause edp_pipeline DAG
        run: |
          RESPONSE=$(aws mwaa create-cli-token \
            --name "${MWAA_ENV_NAME}" \
            --output json)
          CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
          WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

          curl -s -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
            -H "Authorization: Bearer ${CLI_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data "dags unpause edp_pipeline" | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || true

      - name: Trigger edp_pipeline DAG via MWAA CLI
        run: |
          RESPONSE=$(aws mwaa create-cli-token \
            --name "${MWAA_ENV_NAME}" \
            --output json)
          CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
          WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

          HTTP_STATUS=$(curl -s \
            -o /tmp/trigger_out.json \
            -w "%{http_code}" \
            -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
            -H "Authorization: Bearer ${CLI_TOKEN}" \
            -H "Content-Type: text/plain" \
            --data "dags trigger edp_pipeline")

          echo "HTTP status: ${HTTP_STATUS}"
          STDOUT=""
          STDERR=""
          if [ -s /tmp/trigger_out.json ]; then
            STDOUT=$(jq -r '.stdout // ""' /tmp/trigger_out.json | base64 --decode 2>/dev/null || true)
            STDERR=$(jq -r '.stderr // ""' /tmp/trigger_out.json | base64 --decode 2>/dev/null || true)
            [ -n "${STDOUT}" ] && echo "stdout: ${STDOUT}"
            [ -n "${STDERR}" ] && echo "stderr: ${STDERR}"
          fi

          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "DAG trigger failed (HTTP ${HTTP_STATUS})."
            exit 1
          fi

          if echo "${STDERR}" | grep -qi "error\|exception\|failed\|not found"; then
            echo "Airflow CLI returned an error. Trigger did not succeed."
            exit 1
          fi

          echo "edp_pipeline triggered. Verifying run was created (up to 25s)..."
          RUN_FOUND=0
          for i in 1 2 3 4 5; do
            sleep 5
            VERIFY_RESP=$(aws mwaa create-cli-token \
              --name "${MWAA_ENV_NAME}" \
              --output json)
            VERIFY_TOKEN=$(echo "${VERIFY_RESP}" | jq -r '.CliToken')
            VERIFY_HOST=$(echo "${VERIFY_RESP}" | jq -r '.WebServerHostname')
            RAW=$(curl -s \
              -X POST "https://${VERIFY_HOST}/aws_mwaa/cli" \
              -H "Authorization: Bearer ${VERIFY_TOKEN}" \
              -H "Content-Type: text/plain" \
              --data "dags list-runs --dag-id edp_pipeline -o json" \
              | jq -r '.stdout // ""' | base64 --decode 2>/dev/null || echo "")
            STATE=$(echo "${RAW}" | python3 -c "
          import sys, json
          try:
              runs = json.loads(sys.stdin.read())
              print(runs[0].get('state','unknown') if runs else 'no_runs')
          except Exception:
              print('no_runs')
          " 2>/dev/null || echo "no_runs")
            echo "  Verify attempt ${i}/5: state=${STATE}"
            if [ "${STATE}" != "no_runs" ]; then
              RUN_FOUND=1
              break
            fi
          done

          if [ "${RUN_FOUND}" -eq 0 ]; then
            echo "DAG run was not created within 25s of trigger."
            exit 1
          fi

      - name: Poll edp_pipeline until success or failure (timeout 30 min)
        run: |
          MAX_ATTEMPTS=60
          SLEEP_SECONDS=30
          ATTEMPT=0

          while [ "${ATTEMPT}" -lt "${MAX_ATTEMPTS}" ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Poll ${ATTEMPT}/${MAX_ATTEMPTS} — $(date -u '+%H:%M:%S UTC')"

            RESPONSE=$(aws mwaa create-cli-token \
              --name "${MWAA_ENV_NAME}" \
              --output json)
            CLI_TOKEN=$(echo "${RESPONSE}" | jq -r '.CliToken')
            WEB_HOSTNAME=$(echo "${RESPONSE}" | jq -r '.WebServerHostname')

            HTTP_STATUS=$(curl -s \
              -o /tmp/poll_out.json \
              -w "%{http_code}" \
              -X POST "https://${WEB_HOSTNAME}/aws_mwaa/cli" \
              -H "Authorization: Bearer ${CLI_TOKEN}" \
              -H "Content-Type: text/plain" \
              --data "dags list-runs --dag-id edp_pipeline -o json")

            if [ "${HTTP_STATUS}" != "200" ]; then
              echo "  Poll request failed (HTTP ${HTTP_STATUS}), retrying..."
              sleep "${SLEEP_SECONDS}"
              continue
            fi

            RAW=$(jq -r '.stdout // ""' /tmp/poll_out.json | base64 --decode 2>/dev/null || echo "")

            STATE=$(echo "${RAW}" | python3 -c "
          import sys, json
          try:
              runs = json.loads(sys.stdin.read())
              if runs:
                  print(runs[0].get('state', 'unknown'))
              else:
                  print('no_runs')
          except Exception:
              print('parse_error')
          " 2>/dev/null || echo "unknown")

            echo "  Most recent run state: ${STATE}"

            case "${STATE}" in
              success)
                echo "edp_pipeline completed successfully."
                exit 0
                ;;
              failed)
                echo "edp_pipeline FAILED. Check the MWAA Airflow UI for task logs."
                exit 1
                ;;
              running|queued|no_runs|unknown|parse_error)
                echo "  Still in progress. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
              *)
                echo "  Unexpected state '${STATE}'. Waiting ${SLEEP_SECONDS}s..."
                sleep "${SLEEP_SECONDS}"
                ;;
            esac
          done

          echo "Timed out after $((MAX_ATTEMPTS * SLEEP_SECONDS / 60)) minutes."
          exit 1

# ── Job 6: Build and deploy analytics agent ───────────────────────────────────
# Runs after whichever trigger job ran. The skipped job counts as success
# for the needs check, so deploy-agent runs when either job completes.

  deploy-agent:
    name: Build and deploy analytics agent (${{ inputs.env }})
    needs: [trigger-step-functions, trigger-mwaa]
    if: ${{ always() && (needs.trigger-step-functions.result == 'success' || needs.trigger-mwaa.result == 'success') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:            ${{ inputs.env }}
      AWS_REGION:     eu-central-1
      CONTAINER_NAME: agent

    steps:
      - name: Checkout platform-analytics-agent
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-analytics-agent
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: edp-${{ env.ENV }}-analytics-agent
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build --target runtime \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-analytics-agent
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-analytics-agent
          cluster:                    edp-${{ env.ENV }}-analytics-agent
          wait-for-service-stability: true

# ── Job 7: Optionally build and deploy Slack MCP gateway ─────────────────────

  deploy-slack-mcp:
    name: Build and deploy Slack MCP gateway (${{ inputs.env }})
    needs: [terraform-apply, deploy-agent]
    if: ${{ always() && needs.deploy-agent.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.env }}

    permissions:
      id-token: write
      contents: read

    env:
      ENV:            ${{ inputs.env }}
      AWS_REGION:     eu-central-1
      CONTAINER_NAME: gateway

    steps:
      - name: Skip when Slack MCP is disabled
        if: ${{ !inputs.deploy_slack_mcp }}
        run: echo "deploy_slack_mcp is false. Skipping Slack MCP gateway deploy."

      - name: Validate Slack secrets
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          if [ -z "${SLACK_APP_TOKEN}" ] || [ -z "${SLACK_BOT_TOKEN}" ]; then
            echo "SLACK_APP_TOKEN and SLACK_BOT_TOKEN secrets are required when deploy_slack_mcp=true."
            exit 1
          fi

      - name: Checkout platform-slack-mcp-gateway
        if: ${{ inputs.deploy_slack_mcp }}
        uses: actions/checkout@v4
        with:
          repository: enterprise-data-platform-emeka/platform-slack-mcp-gateway
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        if: ${{ inputs.deploy_slack_mcp }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/edp-${{ env.ENV }}-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Store Slack tokens in Secrets Manager
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          SLACK_APP_TOKEN: ${{ secrets.SLACK_APP_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          aws secretsmanager put-secret-value \
            --secret-id "/edp/${ENV}/slack_mcp/slack_app_token" \
            --secret-string "${SLACK_APP_TOKEN}" \
            >/dev/null
          aws secretsmanager put-secret-value \
            --secret-id "/edp/${ENV}/slack_mcp/slack_bot_token" \
            --secret-string "${SLACK_BOT_TOKEN}" \
            >/dev/null
          echo "Slack token secrets updated in Secrets Manager."

      - name: Log in to Amazon ECR
        if: ${{ inputs.deploy_slack_mcp }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        if: ${{ inputs.deploy_slack_mcp }}
        id: build-image
        env:
          ECR_REGISTRY:   ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: edp-${{ env.ENV }}-slack-mcp-gateway
          IMAGE_TAG:      sha-${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build \
            -t "${IMAGE_URI}" \
            -t "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest" \
            .
          docker push "${IMAGE_URI}"
          docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          echo "image=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Download current task definition
        if: ${{ inputs.deploy_slack_mcp }}
        env:
          TASK_FAMILY: edp-${{ env.ENV }}-slack-mcp-gateway
        run: |
          aws ecs describe-task-definition \
            --task-definition "${TASK_FAMILY}" \
            --query taskDefinition \
            > task-definition.json

      - name: Update task definition with new image
        if: ${{ inputs.deploy_slack_mcp }}
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name:  ${{ env.CONTAINER_NAME }}
          image:           ${{ steps.build-image.outputs.image }}

      - name: Deploy new task definition to ECS service
        if: ${{ inputs.deploy_slack_mcp }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition:            ${{ steps.task-def.outputs.task-definition }}
          service:                    edp-${{ env.ENV }}-slack-mcp-gateway
          cluster:                    edp-${{ env.ENV }}-slack-mcp-gateway
          wait-for-service-stability: false

      - name: Scale Slack MCP gateway to one task
        if: ${{ inputs.deploy_slack_mcp }}
        run: |
          aws ecs update-service \
            --cluster "edp-${ENV}-slack-mcp-gateway" \
            --service "edp-${ENV}-slack-mcp-gateway" \
            --desired-count 1 \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster "edp-${ENV}-slack-mcp-gateway" \
            --services "edp-${ENV}-slack-mcp-gateway"
          echo "Slack MCP gateway deployed and stable."

# ── Job 8: Session ready — print access URLs ──────────────────────────────────

  session-ready:
    name: Session ready
    needs: [terraform-apply, deploy-agent, deploy-slack-mcp]
    if: ${{ always() && needs.deploy-agent.result == 'success' && needs.deploy-slack-mcp.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Print session summary
        env:
          ENV:          ${{ inputs.env }}
          ORCHESTRATOR: ${{ inputs.orchestrator }}
          DEPLOY_SLACK_MCP: ${{ inputs.deploy_slack_mcp }}
          ALB_DNS:      ${{ needs.terraform-apply.outputs.alb_dns }}
        run: |
          echo ""
          echo "================================================"
          echo "  SESSION IS READY"
          echo "================================================"
          echo ""
          echo "  Environment  : ${ENV}"
          echo "  Orchestrator : ${ORCHESTRATOR}"
          echo ""
          echo "  Streamlit UI (open in browser from within VPC):"
          echo "    http://${ALB_DNS}:8501"
          echo ""
          echo "  FastAPI (curl from within VPC):"
          echo "    curl -s -X POST http://${ALB_DNS}/ask \\"
          echo "      -H 'Content-Type: application/json' \\"
          echo "      -d '{\"question\": \"Which country has the highest revenue?\"}'"
          echo ""
          if [ "${DEPLOY_SLACK_MCP}" = "true" ]; then
            echo "  Slack MCP Gateway:"
            echo "    Deployed. Ask @EDP Analytics Agent in #analytics-agent-demo."
            echo ""
          fi
          echo "  When done: run the Session Destroy workflow."
          echo "  Cost so far: ~\$0.30-\$0.50 (infra up, no queries yet)"
          echo ""
          echo "================================================"
