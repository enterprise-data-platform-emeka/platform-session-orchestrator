name: Recovery tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.1.1 boto3==1.35.0 PyYAML==6.0.2
      - run: python -m pytest tests/ -q
